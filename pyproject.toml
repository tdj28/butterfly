[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly-dynamics"
version = "0.1.0"
description = "Reproducible numerical tools for periodicity-hub research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.1",
  "pillow>=10",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
butterfly = "butterfly.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

name: Public repository checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Run CPU reference smoke check
        run: uv run --no-sync butterfly verify
      - name: Run tests without research artifacts or credentials
        run: uv run --no-sync python -m pytest -q
      - name: Check manuscript citations and figure availability
        run: uv run --no-sync python scripts/check_paper_references.py
      - name: Check tracked public files
        run: uv run --no-sync python scripts/check_public_repository.py

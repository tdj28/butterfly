name: Public repository checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Run CPU reference smoke check
        run: uv run --no-sync butterfly verify
      - name: Run tests without research artifacts or credentials
        run: uv run --no-sync python -m pytest -q
      - name: Check manuscript citations and figure availability
        run: uv run --no-sync python scripts/check_paper_references.py
      - name: Check tracked public files
        run: uv run --no-sync python scripts/check_public_repository.py
